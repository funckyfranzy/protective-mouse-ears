; Protective Mouse Ears – Firmware für ESP32-C3 Super Mini
; Bauen + aufspielen:  .venv/bin/pio run -t upload
; Serieller Monitor:   .venv/bin/pio device monitor

[env:ohren]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.embed_txtfiles = data/muster.json
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINOJSON_ENABLE_COMMENTS=1
lib_deps =
  fastled/FastLED@3.7.8
  bblanchon/ArduinoJson@7.4.3
